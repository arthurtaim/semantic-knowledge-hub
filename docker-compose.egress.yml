# Opt-in override: gives the backend a route to APPROVED internal hosts (GitLab, MCP, AI endpoint).
# Use only after the integrations are approved and configured in .env:
#   docker compose -f docker-compose.yml -f docker-compose.egress.yml up --build -d
# Host allowlisting is still enforced by the application (AI_ALLOWED_HOSTS, CONFLUENCE_LINK_HOSTS, …);
# restrict egress further with the corporate proxy/firewall.
services:
  backend:
    networks:
      - internal
      - egress
    environment:
      KNOWLEDGE_BACKEND: ${KNOWLEDGE_BACKEND:-local}
      GITLAB_URL: ${GITLAB_URL:-}
      GITLAB_PROJECT_ID: ${GITLAB_PROJECT_ID:-}
      GITLAB_DEFAULT_BRANCH: ${GITLAB_DEFAULT_BRANCH:-main}
      GITLAB_KNOWLEDGE_PATH: ${GITLAB_KNOWLEDGE_PATH:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      CONFLUENCE_MCP_URL: ${CONFLUENCE_MCP_URL:-}
      CONFLUENCE_MCP_AUTH_TOKEN: ${CONFLUENCE_MCP_AUTH_TOKEN:-}
      CONFLUENCE_MCP_TOOL_MAP: ${CONFLUENCE_MCP_TOOL_MAP:-}
      CONFLUENCE_LINK_HOSTS: ${CONFLUENCE_LINK_HOSTS:-}

networks:
  egress: {}
