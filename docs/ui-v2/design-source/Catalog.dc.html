<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>SKH — каталог документов</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#17663F}a:hover{color:#11512F}
.app *{box-sizing:border-box}
.app button,.app input{font-family:inherit}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid #D7DCD8;background:#FFFFFF;color:#1A1F1C;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:#F4F6F3}
.seg{height:26px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:#4C5550;font-size:12.5px;cursor:pointer}
.seg.on{background:#FFFFFF;color:#1A1F1C;font-weight:500;box-shadow:0 1px 2px rgba(16,24,20,.08),0 0 0 1px rgba(16,24,20,.06)}
.fchip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 6px 0 10px;border-radius:8px;border:1px solid #E1E6E1;background:#FFFFFF;font-size:12.5px;color:#2B322E}
.trow{display:grid;grid-template-columns:minmax(280px,1fr) 150px 190px 120px 70px;align-items:center;gap:16px;height:42px;padding:0 20px;border-bottom:1px solid #F0F2EF;font-size:13.5px}
.trow:hover{background:#F8FAF8}
.grp{display:flex;align-items:center;gap:8px;height:36px;padding:0 20px;background:#F7F8F6;border-bottom:1px solid #EEF1ED;font-size:12.5px;font-weight:600;color:#3A423D}
input::placeholder{color:#7D8680}
</style>
</helmet>
<div class="app" style="display: flex; flex-wrap: wrap; min-height: 900px; width: 100%; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 20px; color: #1A1F1C; background: #FFFFFF; -webkit-font-smoothing: antialiased">
  <div style="flex: 0 0 248px; display: flex">
    <dc-import name="Sidebar" active="docs" hint-size="248px,900px"></dc-import>
  </div>

  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <header style="height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 20px; border-bottom: 1px solid #EBEEEA">
      <h2 style="margin: 0; font-size: 14px; font-weight: 600">Документы</h2>
      <span style="font-size: 13px; color: #6B746E">83</span>
      <div role="tablist" aria-label="Вид" style="display: inline-flex; gap: 2px; padding: 3px; border-radius: 8px; background: #F0F2EF; margin-left: 8px">
        <button role="tab" aria-selected="false" class="seg">Список</button>
        <button role="tab" aria-selected="true" class="seg on">Таблица</button>
        <button role="tab" aria-selected="false" class="seg">Карта</button>
      </div>
      <span style="flex: 1"></span>
      <label style="display: flex; align-items: center; gap: 8px; height: 32px; width: 260px; padding: 0 10px; border: 1px solid #DDE2DD; border-radius: 8px; color: #6B746E">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7.5"></circle><path d="m20.5 20.5-4-4"></path></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Фильтр по названию</span>
        <input placeholder="Найти в списке" style="border: 0; outline: none; flex: 1; font-size: 13px; color: #1A1F1C; background: transparent; min-width: 0">
      </label>
      <button class="btn" style="background: #1C7A4C; border-color: #1C7A4C; color: #FFFFFF">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Создать документ</button>
    </header>

    <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 20px; border-bottom: 1px solid #EBEEEA">
      <span class="fchip">Статус: Утверждён, На ревью
        <button aria-label="Убрать фильтр статуса" style="width: 20px; height: 20px; border: 0; border-radius: 5px; background: transparent; color: #6B746E; cursor: pointer; display: inline-flex; align-items: center; justify-content: center">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></span>
      <span class="fchip">Источник: Документы команды
        <button aria-label="Убрать фильтр источника" style="width: 20px; height: 20px; border: 0; border-radius: 5px; background: transparent; color: #6B746E; cursor: pointer; display: inline-flex; align-items: center; justify-content: center">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></span>
      <button class="btn" style="height: 28px; border-style: dashed; color: #4C5550">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Фильтр</button>
      <span style="flex: 1"></span>
      <button class="btn" style="height: 28px; border: 0; color: #4C5550">Группировка: Раздел
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
      <button class="btn" style="height: 28px; border: 0; color: #4C5550">Вид
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
    </div>

    <div role="table" aria-label="Документы" style="overflow-x: auto">
      <div role="row" class="trow" style="height: 34px; font-size: 12px; color: #6B746E; border-bottom: 1px solid #EBEEEA">
        <span role="columnheader">Название</span><span role="columnheader">Статус</span><span role="columnheader">Владелец</span><span role="columnheader">Обновлён</span><span role="columnheader">Связи</span>
      </div>
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
        <div role="rowgroup">
          <div class="grp">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
            <span>{{ g.name }}</span><span style="font-weight: 400; color: #6B746E">{{ g.count }}</span>
          </div>
          <sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="4">
            <div role="row" class="trow">
              <span role="cell" style="display: flex; align-items: baseline; gap: 10px; min-width: 0">
                <a href="#" style="color: #1A1F1C; text-decoration: none; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.title }}</a>
                <span style="font-size: 12px; color: #6B746E; white-space: nowrap">{{ r.id }}</span>
              </span>
              <span role="cell" style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: {{ r.color }}">
                <sc-if value="{{ r.approved }}" hint-placeholder-val="{{ true }}">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2E8B57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.8l2.3 1.7 2.9-.1.9 2.7 2.3 1.7-.8 2.8.8 2.8-2.3 1.7-.9 2.7-2.9-.1L12 21.2l-2.3-1.7-2.9.1-.9-2.7-2.3-1.7.8-2.8-.8-2.8 2.3-1.7.9-2.7 2.9.1Z"></path><path d="m9 12 2 2 4-4"></path></svg>
                </sc-if>
                <sc-if value="{{ r.review }}" hint-placeholder-val="{{ false }}">
                  <span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: #6A50C2; margin: 0 2px"></span>
                </sc-if>
                <sc-if value="{{ r.draft }}" hint-placeholder-val="{{ false }}">
                  <span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; border: 2px dashed #B3740F; margin: 0 2px; box-sizing: border-box"></span>
                </sc-if>
                <span style="text-decoration: {{ r.strike }}">{{ r.status }}</span>
              </span>
              <span role="cell" style="color: #3A423D; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.owner }}</span>
              <span role="cell" style="color: #5E6862; font-size: 13px">{{ r.updated }}</span>
              <span role="cell" style="color: #5E6862; font-size: 13px; font-variant-numeric: tabular-nums">{{ r.links }}</span>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const st = {
      approved: { status: 'Утверждён', color: '#1A1F1C', approved: true, review: false, draft: false, strike: 'none' },
      review: { status: 'На ревью', color: '#4E3A9E', approved: false, review: true, draft: false, strike: 'none' },
      draft: { status: 'Черновик', color: '#8A5300', approved: false, review: false, draft: true, strike: 'none' },
      old: { status: 'Устарел', color: '#5F665F', approved: false, review: false, draft: false, strike: 'line-through' }
    };
    const r = (title, id, s, owner, updated, links) => ({ title, id, owner, updated, links, ...st[s] });
    return {
      groups: [
        { name: 'Интеграции', count: '19', rows: [
          r('ARIS → Catalog: обзор потока', 'DEMO-INT-001', 'approved', 'demo-integration-team', '20 нояб.', '7'),
          r('ARIS → Catalog: маппинг полей', 'DEMO-INT-002', 'approved', 'demo-integration-team', '20 нояб.', '5'),
          r('ARIS: валидационные ограничения', 'DEMO-INT-003', 'approved', 'demo-integration-team', '19 нояб.', '4'),
          r('Ночная полная выгрузка ARIS', 'DEMO-INT-018', 'old', 'demo-integration-team', '2 окт.', '2')
        ] },
        { name: 'Системы-источники', count: '12', rows: [
          r('Source Ownership & Boundaries', 'DEMO-SRC-012', 'approved', 'demo-semantic-team', 'сегодня', '9'),
          r('Data Quality Monitor: контроль качества', 'DEMO-SRC-011', 'approved', 'demo-semantic-team', 'сегодня', '6'),
          r('Archive Store: исторические снимки', 'DEMO-SRC-010', 'review', 'demo-semantic-team', 'сегодня', '3'),
          r('External Registry: внешний справочник', 'DEMO-SRC-009', 'approved', 'demo-semantic-team', 'сегодня', '5')
        ] },
        { name: 'Датасеты', count: '3', rows: [
          r('Датасет Process Overview', 'DEMO-SEM-009', 'approved', 'demo-semantic-team', '18 нояб.', '6'),
          r('Датасет Dependency Graph', 'DEMO-SEM-010', 'approved', 'demo-semantic-team', '18 нояб.', '4'),
          r('Расписание обновления метаданных v2', 'DEMO-SEM-014', 'draft', 'не назначен', '17 нояб.', '1')
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
