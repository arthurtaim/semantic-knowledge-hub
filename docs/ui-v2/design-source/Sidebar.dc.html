<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Боковая панель</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<aside style="width: 248px; min-height: 900px; height: 100%; box-sizing: border-box; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; background: #EEF1ED; border-right: 1px solid #E0E5E0; font-family: Inter, system-ui, sans-serif; font-size: 13px; line-height: 20px; color: #1A1F1C">
  <div style="display: flex; align-items: center; gap: 10px; padding: 6px 8px 12px">
    <span aria-hidden="true" style="width: 26px; height: 26px; box-sizing: border-box; border-radius: 7px; background: #1C7A4C; display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 0 7px">
      <span style="height: 2px; background: #FFFFFF; border-radius: 1px"></span>
      <span style="height: 2px; width: 8px; background: #CFE5D8; border-radius: 1px"></span>
    </span>
    <span style="display: flex; flex-direction: column; line-height: 16px">
      <span style="font-weight: 600; font-size: 13.5px">Knowledge Hub</span>
      <span style="font-size: 12px; color: #5E6862">Семантический слой</span>
    </span>
  </div>
  <a href="#" style="display: flex; align-items: center; gap: 10px; height: 32px; box-sizing: border-box; padding: 0 10px; border-radius: 7px; border: 1px solid #DDE2DD; background: #FFFFFF; color: #6B746E; text-decoration: none; margin-bottom: 8px">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7.5"></circle><path d="m20.5 20.5-4-4"></path></svg>
    <span style="flex: 1">Поиск</span>
    <span style="font-size: 11.5px; border: 1px solid #E0E5E0; border-radius: 5px; padding: 0 5px; line-height: 18px">Ctrl K</span>
  </a>
  <a href="#" style="{{ s.assistant }}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 0 1-12.3 7.6L3.5 20.5l1-4.4A8.5 8.5 0 1 1 20.5 12Z"></path></svg>
    <span style="flex: 1">Ассистент</span>
  </a>
  <a href="#" style="{{ s.reviews }}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13h5l1.5 3h5L16 13h5"></path><path d="M5.5 5h13L21 13v6H3v-6Z"></path></svg>
    <span style="flex: 1">Ревью</span>
    <span style="font-size: 12px; color: #14603A; background: #DDEEE3; border-radius: 6px; padding: 0 6px; line-height: 18px; font-weight: 600">3</span>
  </a>
  <div style="font-size: 12px; color: #6B746E; padding: 16px 10px 4px">Знания</div>
  <a href="#" style="{{ s.docs }}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h12v15H6a2 2 0 0 0-2 2Z"></path><path d="M4 20a2 2 0 0 0 2 1h12v-3"></path></svg>
    <span style="flex: 1">Документы</span><span style="font-size: 12px; color: #6B746E">83</span>
  </a>
  <a href="#" style="{{ s.map }}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="12" r="2.5"></circle><circle cx="18" cy="6" r="2.5"></circle><circle cx="18" cy="18" r="2.5"></circle><path d="m8.3 10.9 7.4-3.7M8.3 13.1l7.4 3.7"></path></svg>
    <span style="flex: 1">Карта знаний</span>
  </a>
  <a href="#" style="{{ s.templates }}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"></rect><path d="M3.5 9.5h17M9.5 20.5v-11"></path></svg>
    <span style="flex: 1">Шаблоны</span>
  </a>
  <div style="font-size: 12px; color: #6B746E; padding: 16px 10px 4px">Работа</div>
  <a href="#" style="{{ s.proposals }}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"></circle><circle cx="6" cy="18" r="2.5"></circle><circle cx="18" cy="18" r="2.5"></circle><path d="M6 8.5v7M18 15.5V10a3 3 0 0 0-3-3h-4"></path><path d="m13 4.5-2.5 2.5 2.5 2.5"></path></svg>
    <span style="flex: 1">Предложения</span><span style="font-size: 12px; color: #6B746E">4</span>
  </a>
  <a href="#" style="{{ s.publications }}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3.5M7.5 8 12 3.5 16.5 8"></path><path d="M4.5 14v4.5a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V14"></path></svg>
    <span style="flex: 1">Публикации</span>
  </a>
  <div style="font-size: 12px; color: #6B746E; padding: 16px 10px 4px">Система</div>
  <a href="#" style="{{ s.integrations }}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5v5M15 2.5v5M6 7.5h12v4a6 6 0 0 1-12 0Z"></path><path d="M12 17.5v4"></path></svg>
    <span style="flex: 1">Интеграции</span>
  </a>
  <div style="flex: 1"></div>
  <div style="display: flex; align-items: center; gap: 10px; padding: 10px 8px 4px; border-top: 1px solid #E0E5E0; margin-top: 12px">
    <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 50%; background: #D7E4DB; color: #14603A; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">ДП</span>
    <span style="flex: 1; display: flex; flex-direction: column; line-height: 16px">
      <span>Демо-пользователь</span>
      <span style="font-size: 12px; color: #6B746E">Локальное демо</span>
    </span>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["assistant","reviews","docs","map","templates","proposals","publications","integrations"],"default":"assistant"},"$preview":{"width":248,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'assistant';
    const base = 'display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 10px; border-radius: 7px; text-decoration: none;';
    const ids = ['assistant', 'reviews', 'docs', 'map', 'templates', 'proposals', 'publications', 'integrations'];
    const s = {};
    ids.forEach((id) => {
      s[id] = base + (id === active ? ' background: #E1E6E1; color: #1A1F1C; font-weight: 500;' : ' color: #3A423D;');
    });
    return { s };
  }
}
</script>
</body>
</html>
