# PUBLIC LINK for the personal test stack (opt-in: SKH_PUBLIC_ACCESS=true in deploy/claude-test/claude-test.env).
# Adds a Caddy gateway on ports 80/443 in front of the frontend; the app containers are unchanged and stay on
# loopback/internal networks. Open link by default (Caddyfile); with SKH_PUBLIC_CADDYFILE=Caddyfile.login a login
# (basic auth) from $SKH_PUBLIC_AUTH_DIR/users, generated by deploy.sh, is required.
# Use with docker-compose.yml + docker-compose.claude-test.yml (deploy/claude-test/stack.sh adds it).

services:
  # M6 (docs/WORK_MANAGEMENT.md «Идентичность и права»): behind a shared/public link the backend has no per-user
  # identity (a Basic Auth password is not one), so the native task module is READ-ONLY — no task writes, no private
  # audit, no AI work proposals. The gateway also marks every request (X-SKH-Exposure, Caddyfile*).
  # Owner-approved exception (WORK_SHARED_LOGIN_WRITES=true in the env file): behind the LOGIN gateway the one shared
  # super-user login may write, as a single identity (docs/WORK_MANAGEMENT.md «Общий вход демо-стенда»).
  backend:
    environment:
      WORK_PUBLIC_EXPOSURE: "true"
      WORK_SHARED_LOGIN_WRITES: ${WORK_SHARED_LOGIN_WRITES:-false}

  public-gateway:
    image: caddy:2.10.2-alpine
    depends_on:
      - frontend
    environment:
      SKH_PUBLIC_IP: ${SKH_PUBLIC_IP:?set SKH_PUBLIC_IP}
      SKH_PUBLIC_HOST: ${SKH_PUBLIC_HOST:?set SKH_PUBLIC_HOST}
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./deploy/claude-test/${SKH_PUBLIC_CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - ${SKH_PUBLIC_AUTH_DIR:-/opt/semantic-kb-claude-test/public-auth}:/etc/caddy/auth:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    restart: unless-stopped

volumes:
  caddy_data: {}
  caddy_config: {}
