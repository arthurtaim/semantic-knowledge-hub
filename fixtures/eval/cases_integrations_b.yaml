- case_id: KE-INTB-010
  category: relation
  question: "Как проект нового расписания связан со сравнением CDC и full refresh?"
  method: graph_path
  start: DEMO-INT-017
  end: DEMO-INT-010
  expected_path: [DEMO-INT-017, DEMO-INT-013, DEMO-INT-010]
  max_depth: 3
  expected_doc_ids: [DEMO-INT-017, DEMO-INT-013, DEMO-INT-010]
  facts_required: []
  facts_forbidden: []
  expected_no_answer: false
  holdout: true
  notes: "Two `depends_on` hops: draft INT-017 → approved schedule INT-013 → INT-010. Any path of length ≤ 3 nodes passes."

- case_id: KE-INTB-011
  category: synthesis
  question: "Как часто метаданные ARIS обновляются в каталоге и выдерживается ли актуальность Process Overview?"
  method: assistant
  filters: {}
  expected_doc_ids: [DEMO-INT-013]
  facts_required: ["каждые 6 ч", "12 ч"]
  facts_forbidden: ["каждый час", "в начале каждого часа"]
  expected_no_answer: false
  holdout: false
  notes: "Grounded answer must use the approved schedule (DEMO-INT-013), never the hourly value of the draft DEMO-INT-017. «ежечасно» is not forbidden because approved GOV-005/GOV-007/ADR-002 mention «ежечасной» while warning about the draft."
