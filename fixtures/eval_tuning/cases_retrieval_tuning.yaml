  category: rq_multidoc
  question: Когда запускается поток CATIA в каталог и как из номера изделия строится идентификатор узла в графе зависимостей?
  method: assistant
  expected_doc_ids: [DEMO-INT-004, DEMO-INT-005]
  facts_required: ["02:30", "node_id"]
  holdout: false
  notes: Schedule from the flow overview, node id rule from the field mapping.
- case_id: RQ-MD-02
  category: rq_multidoc
  question: Сколько повторных попыток делает поток при недоступности источника и сколько часов реестр помнит обработанный ключ идемпотентности?
  method: assistant
  expected_doc_ids: [DEMO-INT-011, DEMO-INT-012]
  facts_required: ["5 повторных", "72 ч"]
  holdout: false
  notes: Retry count from the retry policy, key retention from the idempotency rules.

