# Independent TUNING probes for the retrieval-quality work (2026-11-26). Synthetic, written from the documents'
# own content BEFORE any retrieval change and run on the unchanged baseline first. They test general patterns
# (a fact in a later section, facts in two documents, the canonical source vs an overview, a colloquial
# paraphrase, local-vs-external sufficiency) on documents and Confluence mock pages that are NOT the subject of
# the 216-case gold suite's holdout cases. Not part of fixtures/eval: the 216-case suite stays comparable.
#
#   cd backend && ../.venv/bin/python -m app.evaluation.knowledge_eval --kb ../fixtures/knowledge \
#       --cases ../fixtures/eval_tuning --label tuning_probes --out <dir>

# --- a fact in a later (not top-2 by BM25) section of one document --------------------------------------------
- case_id: RQ-MS-01
  category: rq_multisection
  question: Что делают с архивным снимком, у которого повреждён манифест, и кто проверяет, что у каждого удаления снимка есть запись в журнале?
  method: assistant
  expected_doc_ids: [DEMO-GOV-008]
  facts_required: ["-r1", "Steward ежемесячно проверяет"]
  holdout: false
  notes: Exception section (corrected snapshot -r1) + control section (monthly steward check) of the same standard.
- case_id: RQ-MS-02
  category: rq_multisection
  question: Какие ошибки потока повторяются автоматически, сколько длится полный цикл повторов и куда уходит пакет ARIS, не прошедший валидацию?
  method: assistant
  expected_doc_ids: [DEMO-INT-011]
  facts_required: ["E-SRC-003", "15 мин 30 с", "q_aris_rejected"]
  holdout: false
  notes: Error codes table, transformation rules (full cycle) and error cases of the retry policy.
- case_id: RQ-MS-03
  category: rq_multisection
  question: Как ERP сообщает, что позиция справочника удалена, какого размера пакеты в выгрузке и какая роль разбирает пустые описания колонок?
  method: assistant
  expected_doc_ids: [DEMO-SRC-005]
  facts_required: ["отсутствует в следующем полном снимке", "2 000 строк", "src-steward-erp"]
  holdout: false
  notes: Constraints, outputs and owners sections of the ERP source profile.
- case_id: RQ-MS-04
  category: rq_multisection
  question: Что происходит, если изделие CATIA ссылается на неизвестную сборку, и почему один неудачный запуск уже означает нарушение актуальности?
  method: assistant
  expected_doc_ids: [DEMO-INT-004]
  facts_required: ["unknown_assembly", "не старше 24 часов"]
  holdout: false
  notes: Error cases + constraints of the CATIA flow overview.

