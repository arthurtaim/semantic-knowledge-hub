# Curated synthetic QA set (PRODUCT.md success metric: 10 questions are either source-grounded
# or explicitly report missing evidence). Runs against fixtures/knowledge with AI_PROVIDER=mock.
# Synthetic only — answers are about the demo application, never about the bank.
- id: QA-01
  question: What layers does the demonstration architecture have?
  expect: {confidence: [supported], cited_any: [SEM-ARCH-001]}
- id: QA-02
  question: Who decides whether to merge a proposal?
  expect: {confidence: [supported], cited_any: [SEM-PROC-001]}
- id: QA-03
  question: Почему для поиска выбран SQLite FTS5?
  expect: {confidence: [supported], cited_any: [SEM-DEC-001]}
