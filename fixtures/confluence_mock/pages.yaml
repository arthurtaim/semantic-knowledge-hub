    body: |
      <p><em>Синтетическая демо-страница mock Confluence, не документ банка.</em></p>
      <h2>Назначение</h2>
      <p>Страница описывает ротацию дежурных ролей для потоков метаданных учебной модели. Здесь указаны только роли; распределение ролей по командам ведётся в отдельном графике.</p>
      <h2>Роли</h2>
      <ul>
      <li><strong>Основной дежурный по интеграциям</strong> (Primary On-call) — первым получает сигнал от Data Quality Monitor и подтверждает его.</li>
      <li><strong>Резервный дежурный</strong> (Secondary On-call) — подключается при эскалации.</li>
      <li><strong>Координатор инцидента</strong> — ведёт коммуникацию, если сбой затрагивает несколько потоков.</li>
      </ul>
      <h2>Правила ротации</h2>
      <ol>
      <li>Дежурные роли сменяются еженедельно, по понедельникам в 10:00 (условное время).</li>
      <li>Один и тот же участник не может быть основным дежурным две недели подряд.</li>
      <li>Основной и резервный дежурный одной недели назначаются из разных команд.</li>
      </ol>
      <h2>Эскалация</h2>
      <ol>
      <li>Если основной дежурный не подтвердил сигнал, через 30 минут выполняется эскалация на резервного дежурного.</li>
      <li>Если и резервный дежурный не подтвердил сигнал в течение следующих 30 минут, подключается координатор инцидента.</li>
      <li>Сообщения в очереди недоставленных сообщений разбираются в рабочее время и не требуют ночной эскалации, если поток продолжает работать по расписанию.</li>
      </ol>

