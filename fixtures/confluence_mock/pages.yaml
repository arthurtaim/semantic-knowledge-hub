  - page_id: "200113"
    space: DEMO
    title: "Повторные попытки и DLQ в потоках метаданных (демо)"
    version: 1
    status: approved
    owner: demo-ops-team
    updated_at: "2026-10-06T09:00:00Z"
    labels: [retry, dlq, errors, backoff, integration]
    category: duplicate
