  - page_id: "200123"
    space: ARCH
    title: "Матрица RACI для потоков метаданных (демо)"
    version: 2
    status: approved
    owner: demo-catalog-team
    updated_at: "2026-10-18T10:30:00Z"
    labels: [raci, roles, governance, responsibility]
    category: table
    canonical_document_id: null
    allowed_users: null
    revocable: false
    next_version: null
    body: |
      <p><em>Синтетическая демо-страница mock Confluence, не документ банка.</em></p>
      <h2>Назначение</h2>
      <p>Матрица распределяет ответственность за типовые действия с потоками метаданных учебной модели между ролями Owner, Reviewer, Steward и командой интеграций. Обозначения: R — выполняет, A — отвечает за результат, C — консультирует, I — информируется.</p>
      <h2>Матрица</h2>
      <table>
      <tr><th>Действие</th><th>Owner</th><th>Reviewer</th><th>Steward</th><th>Команда интеграций</th></tr>
      <tr><td>Изменение расписания потока</td><td>A</td><td>R</td><td>C</td><td>R</td></tr>
      <tr><td>Регистрация соответствия в MAP_ARIS_PROCESS</td><td>I</td><td>—</td><td>R, A — в течение 1 рабочего дня после отчёта запуска</td><td>I</td></tr>
      <tr><td>Повторная отправка сообщений из DLQ</td><td>A</td><td>—</td><td>I</td><td>R</td></tr>
      <tr><td>Пересмотр порогов полноты</td><td>A</td><td>R</td><td>R</td><td>C</td></tr>
      <tr><td>Разбор инцидента качества данных</td><td>C</td><td>I</td><td>A, R</td><td>R</td></tr>
      <tr><td>Ввод новой интеграции в эксплуатацию</td><td>A</td><td>R</td><td>C</td><td>R</td></tr>
      </table>
      <h2>Правила</h2>
      <ul>
      <li>У каждого действия ровно одна роль с отметкой A.</li>
      <li>Reviewer не может быть автором изменения, которое он проверяет.</li>
      <li>Изменение матрицы оформляется новой версией страницы и согласуется Owner всех затронутых потоков.</li>
      </ul>

