    revocable: false
    next_version: null
    body: |
      <p><em>Синтетическая демо-страница mock Confluence, не документ банка.</em></p>
      <h2>Назначение</h2>
      <p>Страница задаёт правило разбора инцидентов качества данных (DQ) после их закрытия (post-incident review). Цель разбора — устранить причину, а не только последствия.</p>
      <h2>Уровни инцидентов</h2>
      <ul>
      <li><strong>DQ-S1</strong> — нарушен порог полноты или актуальности датасета, который выдаётся через Consumer API;</li>
      <li><strong>DQ-S2</strong> — нарушен порог полноты или актуальности внутреннего датасета или каталога;</li>
      <li><strong>DQ-S3</strong> — единичные отклонения, не нарушившие порогов.</li>
      </ul>
      <h2>Правило разбора</h2>
      <ol>
      <li>Для инцидентов DQ-S1 и DQ-S2 разбор обязателен и проводится не позднее 5 рабочих дней после закрытия инцидента.</li>
      <li>Для DQ-S3 разбор не обязателен; достаточно записи в журнале монитора.</li>
      <li>Разбор ведёт Steward датасета; участвуют Owner затронутого потока и основной дежурный, принявший сигнал.</li>
      <li>Итоговый документ разбора содержит хронологию, причину, затронутые датасеты и корректирующие действия с ответственными ролями.</li>
      <li>Корректирующие действия получают срок не более 20 рабочих дней.</li>
      <li>Разбор проводится без поиска виноватых: в документе указываются роли, а не участники.</li>
      </ol>
      <h2>Пример</h2>
      <p>Два пропущенных подряд запуска ARIS → Catalog нарушили требование актуальности Process Overview — это инцидент DQ-S1. Инцидент закрыт во вторник; разбор должен состояться не позднее вторника следующей недели.</p>

