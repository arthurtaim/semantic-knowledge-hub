      <p><em>Синтетическая демо-страница mock Confluence, не документ банка.</em></p>
      <h2>О странице</h2>
      <p>Сюда собираются идеи по развитию каталога учебной модели. Идеи не оценены, не приоритизированы и не имеют сроков; включение идеи в список не означает, что она будет реализована.</p>
