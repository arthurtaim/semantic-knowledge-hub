      <ul>
      <li>Поиск по синонимам и аббревиатурам в карточках каталога.</li>
      <li>Показ lineage прямо в карточке датасета.</li>
      <li>Отметка класса чувствительности рядом с названием записи.</li>
      <li>Уведомление Owner, если запись давно не обновлялась.</li>
      <li>Массовое редактирование описаний процессов.</li>
      <li>Сравнение двух версий карточки записи.</li>
      <li>Экспорт карточек в табличный формат для ревью.</li>
      <li>Подсказки стюарду при регистрации соответствий для ARIS.</li>
