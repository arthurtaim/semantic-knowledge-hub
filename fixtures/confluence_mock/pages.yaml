      <p><em>Синтетическая демо-страница mock Confluence, не документ банка.</em></p>
      <h2>Назначение</h2>
      <p>Чек-лист проверяется перед переводом нового потока метаданных из тестовой среды в эксплуатацию (go-live). Все 7 пунктов обязательны; невыполненный пункт переносит дату ввода.</p>
      <h2>Чек-лист</h2>
      <ol>
      <li>Спецификация интеграции утверждена и имеет назначенного Owner.</li>
      <li>Маппинг полей проверен пробным прогоном на тестовом пакете не менее 200 записей.</li>
      <li>Для потока подключены общая политика повторных попыток и очередь недоставленных сообщений.</li>
      <li>Метрики полноты и актуальности потока зарегистрированы в Data Quality Monitor.</li>
      <li>Поток добавлен в ротацию дежурных ролей.</li>
      <li>Три плановых запуска подряд в тестовой среде завершились без ошибок.</li>
      <li>Дата ввода не попадает в окно заморозки изменений метаданных.</li>
      </ol>
      <h2>Кто проверяет</h2>
      <p>Пункты 1–4 подтверждает Reviewer интеграции, пункты 5–7 — координатор выпуска. Результат фиксируется в заявке на ввод: по каждому пункту ставится отметка «выполнено» и указывается подтверждение, например номер отчёта запуска.</p>
      <h2>Частые причины переноса</h2>
      <ul>
      <li>пробный прогон выполнен на слишком маленьком пакете;</li>
      <li>метрики зарегистрированы, но не привязаны к датасету;</li>
      <li>дата ввода выбрана внутри окна заморозки.</li>
      </ul>

