    body: |
      <p><em>Синтетическая демо-страница mock Confluence, не документ банка.</em></p>
      <h2>Назначение</h2>
      <p>Список сокращений, которые команда мониторинга учебной модели использует в отчётах Data Quality Monitor и на дежурствах. Значения ниже действуют в отчётах мониторинга; в других документах те же буквы могут означать другое.</p>
      <h2>Сокращения</h2>
      <ul>
      <li><strong>MTTD</strong> (Mean Time To Detect) — среднее время от начала сбоя потока до первого сигнала монитора.</li>
      <li><strong>MTTA</strong> (Mean Time To Acknowledge) — среднее время от сигнала до подтверждения дежурным.</li>
      <li><strong>MTTR</strong> (Mean Time To Restore) — среднее время от начала сбоя до восстановления плановых запусков потока. В команде мониторинга MTTR означает именно восстановление (restore), а не ремонт (repair).</li>
      <li><strong>ACK</strong> — подтверждение сигнала дежурным.</li>
      <li><strong>RCA</strong> (Root Cause Analysis) — анализ первопричины в рамках разбора инцидента.</li>
      <li><strong>FP</strong> (False Positive) — ложный сигнал, после которого поток работал без нарушений.</li>
      </ul>
      <h2>Правила расчёта</h2>
      <ul>
      <li>MTTD, MTTA и MTTR считаются помесячно по инцидентам уровней DQ-S1 и DQ-S2.</li>
      <li>Ложные сигналы (FP) в расчёт MTTD не входят.</li>
      <li>Время считается в минутах и округляется вверх до целой минуты.</li>
      </ul>

