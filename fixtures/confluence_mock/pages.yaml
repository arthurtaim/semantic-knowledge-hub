      <p><em>Синтетическая демо-страница mock Confluence, не документ банка.</em></p>
      <p>Краткая выжимка регламента статусов из базы знаний (документ DEMO-GOV-001).</p>
      <h2>Статусы</h2>
      <ul>
      <li>Допустимы ровно четыре статуса: <code>draft</code>, <code>in_review</code>, <code>approved</code>, <code>deprecated</code>.</li>
      <li>Отдельного статуса «superseded» нет: заменённый документ — это <code>deprecated</code> плюс связь <code>supersedes</code> в документе-преемнике.</li>
      <li><code>draft</code> и <code>in_review</code> не являются authoritative-источником и не служат доказательством.</li>
      <li><code>approved</code> — единственный authoritative-статус; у такого документа обязательны владелец (не <code>unassigned</code>) и дата <code>reviewed_at</code>.</li>
      <li><code>deprecated</code> хранится для истории и никогда не служит доказательством действующего правила.</li>
      </ul>
      <h2>Правила для ответов</h2>
      <ol>
      <li>Черновики и документы на ревью попадают в ответ только по явному запросу (переключатель «Учитывать черновики») и всегда с пометкой.</li>
      <li>Проверка старше 180 дней по <code>reviewed_at</code> помечается как требующая перепроверки; статус автоматически не меняется.</li>
      <li>Статус меняется только через ревью и merge в репозиторий знаний. ИИ-черновик никогда не получает <code>approved</code> автоматически.</li>
      </ol>

