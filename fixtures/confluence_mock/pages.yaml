      <p><em>Синтетическая демо-страница mock Confluence, не документ банка.</em></p>
      <h2>Назначение</h2>
      <p>При проверке пакета ARIS каждой отклонённой записи присваивается код причины. Код записывается в отчёт запуска в поле <code>reject_reason</code> и помогает стюарду быстро понять, что исправлять в источнике. Код причины дополняет код ошибки интеграции, но не заменяет его.</p>
      <h2>Коды причин</h2>
      <table>
      <tr><th>Код</th><th>Причина</th><th>Код ошибки интеграции</th><th>Кто исправляет</th></tr>
      <tr><td>R-01</td><td>не заполнен обязательный атрибут</td><td>E-VAL-002</td><td>Owner модели в ARIS</td></tr>
      <tr><td>R-02</td><td>глубина иерархии модели больше допустимой</td><td>E-VAL-002</td><td>Owner модели в ARIS</td></tr>
      <tr><td>R-03</td><td>объект в статусе obsolete</td><td>E-VAL-002</td><td>не требуется</td></tr>
      <tr><td>R-04</td><td>нет соответствия в таблице MAP_ARIS_PROCESS</td><td>E-MAP-001</td><td>Steward</td></tr>
      <tr><td>R-05</td><td>роль aris_owner_role не найдена в справочнике ролей</td><td>E-VAL-002</td><td>Owner модели в ARIS</td></tr>
      <tr><td>R-06</td><td>дата aris_last_change позже времени запуска</td><td>E-VAL-002</td><td>Owner модели в ARIS</td></tr>
      </table>
      <h2>Правила</h2>
      <ul>
      <li>Одной записи присваивается только один код — первый подходящий по порядку таблицы.</li>
      <li>Записи с кодом R-03 показываются в отчёте стюарда отдельной строкой «ожидаемое отклонение».</li>
      <li>Новый код причины добавляется только новой версией этой страницы.</li>
      </ul>

  - page_id: "200107"
    space: OPS
    title: "Разбор инцидентов качества данных (демо)"
    version: 2
    status: approved
    owner: demo-dq-team
    updated_at: "2026-09-08T08:40:00Z"
    labels: [data-quality, incident, post-incident-review]
    category: external_only
    canonical_document_id: null
