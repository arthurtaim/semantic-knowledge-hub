    body: |
      <p><em>Синтетическая демо-страница mock Confluence, не документ банка.</em></p>
      <h2>Назначение</h2>
      <p>Инструкции для администратора каталога учебной модели. Операции ниже выполняются только ролью администратора каталога.</p>
      <h2>Регулярные операции</h2>
      <ol>
      <li>Полная переиндексация каталога выполняется по воскресеньям в 05:00 (условное время) и занимает до 40 минут.</li>
      <li>Перед переиндексацией администратор проверяет, что ни один поток метаданных не находится в процессе загрузки.</li>
      <li>Очистка карточек без источника выполняется раз в месяц, только после архивирования карточек.</li>
      </ol>
      <h2>Разовые операции</h2>
      <ul>
      <li>Блокировка карточки от редактирования — по запросу Steward, с указанием причины.</li>
      <li>Восстановление удалённой карточки возможно только из архива и только в течение срока хранения архива.</li>
      <li>Смена Owner карточки выполняется после подтверждения прежнего и нового Owner.</li>
      </ul>
      <h2>Ограничения</h2>
      <p>Администратор не меняет содержимое описаний и классы чувствительности: это делают Owner и Steward. Все операции администратора записываются в журнал изменений.</p>

  - page_id: "200121"
    space: OPS
