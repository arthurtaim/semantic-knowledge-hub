    body: |
      <p><em>Синтетическая демо-страница mock Confluence, не документ банка.</em></p>
      <h2>Назначение</h2>
      <p>Страница вводит классы чувствительности для записей каталога учебной модели. Класс хранится в атрибуте <code>sensitivity_class</code> каждой записи и определяет, кто видит запись и можно ли её выгружать.</p>
      <h2>Классы</h2>
      <ul>
      <li><strong>public</strong> — метаданные можно показывать всем пользователям демо-среды и выгружать через Consumer API без ограничений.</li>
      <li><strong>internal</strong> — метаданные видны всем пользователям демо-среды, выгрузка через Consumer API — только по согласованной заявке.</li>
      <li><strong>restricted</strong> — метаданные видны только ролям с явным разрешением и не выгружаются через Consumer API.</li>
      </ul>
      <h2>Правила</h2>
      <ol>
      <li>Для новой записи каталога класс по умолчанию — internal.</li>
      <li>Повысить класс, например internal → restricted, Owner записи может без согласования.</li>
      <li>Понизить класс restricted до internal или public можно только с согласия Steward.</li>
      <li>Класс датасета не может быть ниже самого высокого класса записей, из которых он собран.</li>
      </ol>
      <h2>Пример</h2>
      <p>Процесс из ARIS попадает в каталог с классом internal. Owner помечает его restricted, потому что описание процесса содержит условные сведения о внутренних проверках. После этого запись перестаёт выдаваться через Consumer API, а датасет, в который она входит, тоже получает класс restricted.</p>

