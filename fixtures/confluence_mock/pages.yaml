    body: |
      <p><em>Синтетическая демо-страница mock Confluence, не документ банка.</em></p>
      <h2>Когда использовать</h2>
      <p>Временная инструкция действует, пока планировщик демо-среды восстанавливается после сбоя. Она описывает, как запустить выгрузку ARIS → Catalog вне расписания. После восстановления планировщика страница будет удалена.</p>
      <h2>Пошагово</h2>
      <ol>
      <li>Убедиться, что предыдущий запуск ARIS → Catalog завершён и не находится в процессе повторных попыток.</li>
      <li>Основной дежурный по интеграциям запускает поток из консоли оркестратора демо-среды в режиме «от водяного знака».</li>
      <li>Ручной запуск выполняется не чаще одного раза за 2 часа.</li>
      <li>Запуск записывается в журнал изменений интеграций с пометкой «ручной».</li>
      </ol>
      <h2>Важно</h2>
      <ul>
      <li>Ручной запуск проходит те же проверки валидации, что и плановый, и использует тот же ключ идемпотентности, поэтому дубликатов не возникает.</li>
      <li>Ручной запуск не сдвигает следующий плановый запуск.</li>
      <li>Если ручной запуск завершился ошибкой, повторно запускать его вручную нельзя: решение принимает координатор инцидента.</li>
      </ul>

