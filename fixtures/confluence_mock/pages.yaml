    body: |
      <p><em>Синтетическая демо-страница mock Confluence, не документ банка.</em></p>
      <h2>Область аудита</h2>
      <p>Квартальная проверка ролей доступа в демо-среде учебной модели: каталог, Consumer API и консоль оркестратора потоков. Проверка выполнялась по синтетическим учётным записям.</p>
      <h2>Итоги</h2>
      <ul>
      <li>Проверено 38 синтетических учётных записей.</li>
      <li>У 6 записей не было активности дольше квартала — роли отозваны.</li>
      <li>У 3 записей роль <code>demo-editor</code> выдана без заявки — роли пересмотрены.</li>
      <li>Две системы-потребителя Consumer API пользовались доступом после даты окончания заявки.</li>
      </ul>
      <h2>Рекомендации</h2>
      <ol>
      <li>Автоматически отзывать доступ к Consumer API в дату окончания заявки.</li>
      <li>Проводить пересмотр роли <code>demo-editor</code> раз в квартал.</li>
      <li>Фиксировать выдачу ролей консоли оркестратора в журнале изменений.</li>
      </ol>
      <h2>Доступ</h2>
      <p>Сводка предназначена только для команды безопасности демо-проекта и не публикуется в других пространствах. Выдержки из неё не передаются в ответы ассистента и в страницы других команд; следующая проверка запланирована по итогам следующего квартала.</p>

  - page_id: "200120"
    space: DEMO
    title: "Инструкции администратора каталога (демо)"
    version: 3
    status: approved
