    body: |
      <p><em>Синтетическая демо-страница mock Confluence, не документ банка.</em></p>
      <h2>Когда нужна заявка</h2>
      <p>Заявка нужна каждой системе-потребителю, которая хочет читать датасеты учебной модели через Consumer API. Доступ выдаётся системе, а не отдельному сотруднику.</p>
      <h2>Поля формы заявки</h2>
      <ol>
      <li><code>consumer_system_code</code> — код системы-потребителя;</li>
      <li><code>requested_datasets</code> — список датасетов, например Process Overview или Dependency Graph;</li>
      <li><code>purpose</code> — цель использования в одном-двух предложениях;</li>
      <li><code>expected_rate</code> — ожидаемая нагрузка в запросах в минуту, не выше лимита контракта выдачи;</li>
      <li><code>owner_role</code> — роль, отвечающая за систему-потребителя;</li>
      <li><code>access_until</code> — дата окончания доступа.</li>
      </ol>
      <h2>Сроки и согласование</h2>
      <ul>
      <li>Заявку согласует Owner каждого запрошенного датасета.</li>
      <li>После согласования доступ предоставляется в течение 3 рабочих дней.</li>
      <li>Доступ выдаётся не более чем на 12 месяцев; продление оформляется новой заявкой.</li>
      <li>Заявка без поля <code>purpose</code> возвращается заявителю без рассмотрения.</li>
      </ul>
      <h2>После выдачи</h2>
      <p>Потребитель получает идентификатор клиента для демо-среды. Учётные данные на этой странице не публикуются и в заявку не вписываются.</p>

  - page_id: "200104"
