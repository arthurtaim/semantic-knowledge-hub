    revocable: true
    next_version: null
    body: |
      <p><em>Синтетическая демо-страница mock Confluence, не документ банка.</em></p>
      <h2>Назначение</h2>
      <p>Сводка условий поддержки условного поставщика инструмента моделирования процессов (тип ARIS) для учебной модели. Условия вымышлены.</p>
      <h2>Окно поддержки</h2>
      <ul>
      <li>Поддержка поставщика работает по рабочим дням с 09:00 до 18:00 (условное время демо-среды).</li>
      <li>Обращения, поданные вне окна поддержки, принимаются в работу в 09:00 следующего рабочего дня.</li>
      <li>Для критичных обращений (выгрузка ARIS полностью остановлена) поставщик отвечает в течение 2 часов в пределах окна поддержки.</li>
      <li>Некритичные обращения получают первый ответ в течение одного рабочего дня.</li>
      </ul>
      <h2>Как обращаться</h2>
      <ol>
      <li>Обращение подаёт Owner потока ARIS → Catalog или основной дежурный по интеграциям.</li>
      <li>К обращению прикладываются код ошибки интеграции и время запуска; тела сообщений не прикладываются.</li>
      <li>Номер обращения записывается в журнал изменений интеграций.</li>
      </ol>
      <h2>Ограничения</h2>
      <p>Поставщик не имеет доступа к каталогу учебной модели и не меняет его настройки; изменения на стороне каталога выполняет команда интеграций.</p>

