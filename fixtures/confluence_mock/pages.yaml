    allowed_users: null
    revocable: false
    next_version: null
    body: |
      <p><em>Синтетическая демо-страница mock Confluence, не документ банка.</em></p>
      <p>Краткий пересказ политики повторных попыток из базы знаний (документ DEMO-INT-011).</p>
      <h2>Коды ошибок</h2>
      <ul>
      <li><code>E-SRC-003</code> — источник недоступен; повторяется по полной политике.</li>
      <li><code>E-MAP-001</code> — маппинг не найден, например нет строки в <code>MAP_ARIS_PROCESS</code>; не повторяется.</li>
      <li><code>E-VAL-002</code> — запись или пакет не прошли валидацию; не повторяется.</li>
      </ul>
      <h2>Политика повторов</h2>
      <ol>
      <li>После первой неудачи с кодом <code>E-SRC-003</code> выполняется не более 5 повторных попыток.</li>
      <li>Задержка растёт экспоненциально (exponential backoff): 30 с → 60 с → 2 мин → 4 мин → 8 мин.</li>
      <li>Суммарное ожидание полного цикла — 15 мин 30 с. Если пятая попытка неудачна, сообщение уходит в <code>dlq.metadata.v1</code> с <code>attempt_count = 5</code>.</li>
      <li>Каждый повтор выполняется с тем же ключом идемпотентности, поэтому дубликатов не возникает.</li>
      <li>Сообщения из DLQ автоматически не обрабатываются: владелец интеграции устраняет причину и повторно отправляет их в поток.</li>
      </ol>
      <h2>Особые случаи</h2>
      <ul>
      <li>Пакет ARIS, в котором проверку прошло меньше 95 % записей, уходит в карантин <code>q_aris_rejected</code>, а не в DLQ.</li>
      <li>Недоступность Event Hub считается недоступностью источника: <code>E-SRC-003</code>.</li>
      <li>Сообщение без ключа идемпотентности отклоняется с <code>E-VAL-002</code> без повтора.</li>
      </ul>

