      <li>Развитие интеграций ARIS → Catalog и CATIA → Catalog — 45 % бюджета.</li>
      <li>Сопровождение каталога и датасетов — 25 % бюджета.</li>
      <li>Мониторинг качества данных — 20 % бюджета.</li>
      <li>Резерв на непредвиденные работы — 10 % бюджета.</li>
      </ul>
      <h2>Правила использования</h2>
      <ol>
      <li>Перераспределение между статьями более чем на 5 % согласует финансовый комитет демо-проекта.</li>
      <li>Резерв расходуется только по решению координатора проекта.</li>
      <li>Отчёт об исполнении бюджета готовится ежеквартально.</li>
      </ol>
      <h2>Доступ</h2>
      <p>Страница доступна только финансовой роли демо-проекта. Цифры не передаются в другие страницы и в ответы ассистента для пользователей без этой роли.</p>

