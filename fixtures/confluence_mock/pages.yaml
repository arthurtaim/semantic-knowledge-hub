  - page_id: "200101"
    space: OPS
    title: "Регламент заморозки изменений метаданных (демо)"
    version: 3
    status: unknown
    owner: demo-ops-team
    updated_at: "2026-10-12T08:00:00Z"
    labels: [metadata, freeze, change-management, aris, catia]
    category: external_only
    canonical_document_id: null
    allowed_users: null
    revocable: false
    next_version: null
    body: |
      <p><em>Синтетическая демо-страница mock Confluence, не документ банка.</em></p>
      <h2>Назначение</h2>
      <p>Страница описывает окно заморозки (change freeze) для изменений в потоках метаданных учебной модели: ARIS → Catalog, CATIA → Catalog, CRM → MDM и ERP → Semantic Layer. Заморозка нужна, чтобы месячные отчёты по датасетам строились на стабильных правилах маппинга и валидации.</p>
      <h2>Когда действует заморозка</h2>
      <ul>
      <li>Окно заморозки изменений метаданных — последние 2 рабочих дня каждого календарного месяца.</li>
      <li>Заморозка начинается в 00:00 первого из этих дней и заканчивается в 08:00 первого рабочего дня следующего месяца (условное время демо-среды).</li>
      <li>Если месяц заканчивается выходными, окно занимает два последних рабочих дня перед ними.</li>
      </ul>
      <h2>Что запрещено во время заморозки</h2>
      <ul>
      <li>изменение таблиц соответствия и правил маппинга полей;</li>
      <li>изменение порогов валидации и расписаний запусков;</li>
      <li>ввод новой интеграции в эксплуатацию.</li>
      </ul>
      <h2>Исключения</h2>
      <p>Разрешены только исправления, без которых поток не может работать, например восстановление после недоступности источника. Исключение согласует роль <strong>координатор выпуска</strong> (Release Coordinator); запрос подаётся с описанием изменения и плана отката.</p>
      <p>Плановые запуски потоков во время заморозки не останавливаются: замораживаются только изменения конфигурации, а не сами загрузки.</p>

