      <p><em>Синтетическая демо-страница mock Confluence, не документ банка.</em></p>
      <h2>Цель встречи</h2>
      <p>Обсудить накопившиеся вопросы по потоку метаданных ARIS → Catalog и договориться, какие из них выносить на ревью. Решения на встрече не принимаются: по итогам будут подготовлены предложения в базу знаний, а действующие правила остаются прежними.</p>
      <h2>Повестка</h2>
      <ol>
      <li>Обзор отклонённых записей ARIS за прошлый месяц: какие причины встречаются чаще всего.</li>
      <li>Нужно ли менять окно заморозки изменений метаданных и как оно сочетается с расписанием потоков.</li>
      <li>Как сообщать владельцам моделей ARIS о записях, попавших в карантин.</li>
      <li>Стоит ли пересматривать размер пакета инкрементальной загрузки.</li>
      <li>Кто готовит предложение по классам чувствительности для процессов из ARIS.</li>
      <li>Разное.</li>
      </ol>
      <h2>Участники</h2>
      <p>Роли: Owner потока ARIS → Catalog, Steward каталога, Reviewer интеграции и представитель команды мониторинга.</p>
      <h2>Подготовка</h2>
      <ul>
      <li>Steward приносит выборку отчётов запусков.</li>
      <li>Команда мониторинга приносит график сигналов по потоку.</li>
      <li>Owner потока готовит список вопросов к поставщику инструмента моделирования.</li>
      </ul>
      <p>Протокол встречи пока не опубликован, решения и сроки не зафиксированы.</p>

