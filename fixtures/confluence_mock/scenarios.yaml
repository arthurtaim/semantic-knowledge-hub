# User scenarios over the synthetic mock Confluence corpus (pages.yaml) for external-only RAG eval cases.
# expected_page_ids: Confluence page ids that must be cited; for local_sufficient scenarios the id of the
# curated document (DEMO-*) that must be cited instead; [] = no answer expected.
# expected_fragment: exact substring of the tag-stripped body of an expected page ("" when no answer).

- scenario_id: EXT-01
  question: "Когда действует окно заморозки изменений метаданных?"
  expected_page_ids: ["200101"]
  expected_fragment: "последние 2 рабочих дня"
  local_sufficient: false
  relevance: relevant
  notes: "external-only fact; page status is unknown (the page does not state it), the answer must say so"

